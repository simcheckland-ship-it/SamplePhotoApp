name: "🟢 Deploy/Update Server Set 20 Infrastructure"

on:
  workflow_dispatch:

jobs:
  terraform:
    name: "Run Terraform"
    runs-on: self-hosted

    defaults:
      run:
        working-directory: ./terraform

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Terraform Init
        run: terraform init

      - name: Generate Secure TFVars
        run: |
          cat << 'EOF' > secret.auto.tfvars
          proxmox_endpoint = "${{ secrets.PROXMOX_ENDPOINT }}"
          proxmox_token    = "${{ secrets.PROXMOX_TOKEN }}"
          server_passwords = {
              "VM200" = "${{ secrets.VM200_PASS }}",
              "VM201" = "${{ secrets.VM201_PASS }}",
              "VM202" = "${{ secrets.VM202_PASS }}",
          }
          EOF

      - name: Terraform Plan
        run: terraform plan -out=tfplan

      - name: Terraform Apply
        run: terraform apply -auto-approve tfplan
        
      - name: Run Ansible Configuration Playbook
        working-directory: ./ansible  
        run: |
          # 1. Ensure basic SSH configuration directory exists
          mkdir -p ~/.ssh
      
          # 2. Write the private key from GitHub Secrets and secure it
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/runner-vm
          chmod 600 ~/.ssh/runner-vm
      
          # 3. Configure Ansible flags globally to silence warnings and force color
          export ANSIBLE_HOST_KEY_CHECKING=False
          export ANSIBLE_FORCE_COLOR=True
          export ANSIBLE_PYTHON_INTERPRETER=auto_silent
      
          # 4. Run playbook forcing OpenSSH to ignore known_hosts entirely
          ansible-playbook -i inventory.ini site.yml \
            --private-key=~/.ssh/runner-vm \
            --ssh-common-args='-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o IdentitiesOnly=yes'
        shell: /usr/bin/bash -e {0}


