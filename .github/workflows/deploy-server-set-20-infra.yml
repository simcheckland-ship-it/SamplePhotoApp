name: "🟢 Deploy/Update Server Set 20 Infrastructure"

on:
  workflow_dispatch:

jobs:
  terraform:
    name: "Run Terraform"
    runs-on: self-hosted

    defaults:
      run:
        working-directory: ./terraform

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Terraform Init
        run: terraform init

      - name: Generate Secure TFVars
        run: |
          cat << 'EOF' > secret.auto.tfvars
          proxmox_endpoint = "${{ secrets.PROXMOX_ENDPOINT }}"
          proxmox_token    = "${{ secrets.PROXMOX_TOKEN }}"
          server_passwords = {
              "VM200" = "${{ secrets.VM0_PASS }}",
              "VM201" = "${{ secrets.VM1_PASS }}",
              "VM201" = "${{ secrets.VM2_PASS }}",
          }
          EOF

      - name: Terraform Plan
        run: terraform plan -out=tfplan

      - name: Terraform Apply
        run: terraform apply -auto-approve tfplan
        
      - name: Run Ansible Configuration Playbook
        run: |
          mkdir -p ~/.ssh
          touch ~/.ssh/known_hosts
          
          # 1. Prepare directory structure
          mkdir -p ~/.ssh
          touch ~/.ssh/known_hosts
      
          # 2. Hard clear old entries for BOTH hostnames and IPs to clear the warning cache
          ssh-keygen -R "10.10.10.110" || true
          ssh-keygen -R "10.10.10.200" || true
          ssh-keygen -R "10.10.10.201" || true
          ssh-keygen -R "app-proxy-server" || true
          ssh-keygen -R "api-server" || true
      
          # 3. Apply standard Ansible variable overrides
          export ANSIBLE_HOST_KEY_CHECKING=False
          export ANSIBLE_FORCE_COLOR=True
          export ANSIBLE_PYTHON_INTERPRETER=auto_silent
      
          # 4. Force OpenSSH to bypass strict verification dynamically on the wire
          ansible-playbook -i inventory.ini site.yml \
            --private-key=~/.ssh/runner-vm \
            --ssh-common-args='-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null'
        working-directory: ./ansible


