name: Deploy React App

on:
  push:
    branches:
      - main
    paths:
      - "app1/**"
      - ".github/workflows/vm0-deploy-app.yml"

jobs:
  build-and-push:
    runs-on: [self-hosted, linux]
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker Image
        run: |
          # Using ${{ github.workspace }} replaces the fragile hardcoded path
          docker build \
            -f ${{ github.workspace }}/app1/DockerFile \
            -t ghcr.io/${{ github.repository_owner }}/react-app:latest \
            ${{ github.workspace }}/app1

          docker push ghcr.io/${{ github.repository_owner }}/react-app:latest

  deploy-to-vm0:
    needs: build-and-push
    runs-on: [self-hosted, linux]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      # FIX: Create a local .env file securely on the runner.
      # This prevents secrets from being exposed in the workflow execution logs.
      - name: Create Production Environment File
        run: |
          echo "VITE_OS_KEY=${{ secrets.OS_KEY }}" > app1/.env
          echo "VITE_TT_KEY=${{ secrets.TT_KEY }}" >> app1/.env
          echo "VITE_GOOGLE_KEY=${{ secrets.GOOGLE_KEY }}" >> app1/.env
          echo "VITE_CESIUM_KEY=${{ secrets.CESIUM_KEY }}" >> app1/.env

      - name: Copy Configuration and Env to vm0 Home Directory
        run: |
          # 1. Create the clean directory on vm0
          ssh -i /home/github-runner/.ssh/runner-to-vm0 -o StrictHostKeyChecking=no "${{ secrets.VM0_USER }}@${{ secrets.VM0_HOST }}" "mkdir -p ~/react-app"

          # 2. Copy BOTH the docker-compose.yml AND the secure .env file over
          scp -i /home/github-runner/.ssh/runner-to-vm0 -o StrictHostKeyChecking=no app1/docker-compose.yml app1/.env ${{ secrets.VM0_USER }}@${{ secrets.VM0_HOST }}:~/react-app/

      - name: Deploy Pre-built Container over SSH
        run: |
          # Clean execution: Docker Compose automatically detects the .env file in the same folder.
          # No manual 'export' strings required.
          ssh -i /home/github-runner/.ssh/runner-to-vm0 -o StrictHostKeyChecking=no "${{ secrets.VM0_USER }}@${{ secrets.VM0_HOST }}" "
            cd ~/react-app &&
            echo '${{ secrets.GITHUB_TOKEN }}' | docker login ghcr.io -u ${{ github.actor }} --password-stdin &&
            docker compose pull &&
            docker compose up -d
          "
