name: Deploy React Photo App

on:
  push:
    branches:
      - main
    paths:
      - "app1/**"
      - ".github/workflows/vm0-deploy-app.yml"

jobs:
  build-and-push:
    runs-on: [self-hosted, linux]
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker Image
        run: |
          # Using ${{ github.workspace }} replaces the fragile hardcoded path
          docker build \
            -f ${{ github.workspace }}/app1/DockerFile \
            -t ghcr.io/${{ github.repository_owner }}/react-app:latest \
            ${{ github.workspace }}/app1

          docker push ghcr.io/${{ github.repository_owner }}/react-app:latest

  deploy-to-vm0:
    needs: build-and-push
    runs-on: [self-hosted, linux]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Copy Configuration to vm0 Home Directory
        run: |
          ssh -i /home/github-runner/.ssh/runner-to-vm0 -o StrictHostKeyChecking=no "${{ secrets.VM0_USER }}@${{ secrets.VM0_HOST }}" "mkdir -p ~/react-app"
          scp -i /home/github-runner/.ssh/runner-to-vm0 -o StrictHostKeyChecking=no app1/docker-compose.yml ${{ secrets.VM0_USER }}@${{ secrets.VM0_HOST }}:~/react-app/

      - name: Deploy Pre-built Container over SSH
        run: |
          ssh -i /home/github-runner/.ssh/runner-to-vm0 -o StrictHostKeyChecking=no "${{ secrets.VM0_USER }}@${{ secrets.VM0_HOST }}" "
            cd ~/react-app &&
            echo '${{ secrets.GITHUB_TOKEN }}' | docker login ghcr.io -u ${{ github.actor }} --password-stdin &&
            docker compose pull &&
            docker compose up -d
          "

