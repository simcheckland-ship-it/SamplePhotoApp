name: Deploy Nginx Reverse Proxy to vm20

on:
  workflow_call:

jobs:
  deploy:
    # Tells GitHub to execute this job on your local Linux runner
    runs-on: [self-hosted, linux]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Clear old SSH host key
        run: |
          # Create the local directory structure first if it doesn't exist
          mkdir -p ~/.ssh

          # Let the runner manage its own files using ~
          ssh-keygen -R "${{ secrets.VM20_HOST }}" || true
          ssh-keyscan -H "${{ secrets.VM20_HOST }}" >> ~/.ssh/known_hosts

      - name: Copy Proxy Config Files to vm20
        run: |
          # 1. Copy files into /opt/nginx-proxy/
          scp -i /root/.ssh/runner-vm -o StrictHostKeyChecking=no proxy/* ${{ secrets.VM20_USER }}@${{ secrets.VM20_HOST }}:/opt/nginx-proxy/

      - name: Start Nginx Proxy Container on vm20 -
        run: |
          ssh -i /root/.ssh/runner-vm -o StrictHostKeyChecking=no "${{ secrets.VM20_USER }}@${{ secrets.VM20_HOST }}" "
            cd /opt/nginx-proxy && 
            docker compose down && 
            docker compose up -d --force-recreate
          "
