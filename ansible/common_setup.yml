---
- name: "🌐 Baseline OS Hardening "
  hosts: all # 🟢 Targets every machine inside inventory.ini
  become: true

  tasks:
    - name: Ensure clean baseline state
      become: true
      block:
        # 1. Purge legacy, broken source definitions that crash 'apt update'
        - name: Remove broken legacy Docker repositories
          ansible.builtin.file:
            path: "{{ item }}"
            state: absent
          loop:
            - /etc/apt/sources.list.d/docker.list
            - /etc/apt/sources.list.d/download_docker_com_linux_ubuntu.list
  
    - name: Install baseline system prerequisites
      apt:
        name:
          [
            apt-transport-https,
            ca-certificates,
            curl,
            gnupg,
            software-properties-common,
          ]
        state: present
        update_cache: yes
      become: true
      register: apt_result
      until: apt_result is success
      retries: 15
      delay: 10

    - name: Assign deployment user to the docker group
      user:
        name: "{{ ansible_user }}"
        groups: docker
        append: yes
