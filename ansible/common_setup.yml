---
- name: "🌐 Baseline OS Hardening & Docker Installation"
  hosts: all # 🟢 Targets every machine inside inventory.ini
  become: true

  tasks:
    - name: Install baseline system prerequisites
      apt:
        name:
          [
            apt-transport-https,
            ca-certificates,
            curl,
            gnupg,
            software-properties-common,
          ]
        state: present
        update_cache: yes

    - name: Create directory for system keyrings
      file:
        path: /etc/apt/keyrings
        state: directory
        mode: "0755"

    - name: Fetch official Docker GPG key
      get_url:
        url: https://download.docker.com/linux/ubuntu/gpg # Use canonical Docker source
        dest: /etc/apt/keyrings/docker.asc
        mode: "0644"

    - name: Register upstream Docker apt repository
      apt_repository:
        repo: "deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable"
        state: present
        filename: docker

    - name: Install official Docker Engine and Compose plugin
      apt:
        name:
          [
            docker-ce,
            docker-ce-cli,
            containerd.io,
            docker-buildx-plugin,
            docker-compose-plugin,
          ]
        state: present
        update_cache: yes

    - name: Assign deployment user to the docker group
      user:
        name: "{{ ansible_user }}"
        groups: docker
        append: yes
