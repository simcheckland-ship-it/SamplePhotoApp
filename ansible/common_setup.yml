---
- name: "🌐 Baseline OS Hardening "
  hosts: all # 🟢 Targets every machine inside inventory.ini
  become: true

  tasks:
    - name: Ensure clean baseline state
      become: true
      block:
        # 🟢 FIXED: Indented 2 spaces right to sit inside the block
        - name: Remove broken legacy Docker repositories
          ansible.builtin.file:
            path: "{{ item }}"
            state: absent
          loop:
            - /etc/apt/sources.list.d/docker.list
            - /etc/apt/sources.list.d/download_docker_com_linux_ubuntu.list
  
    - name: Install baseline system prerequisites
      apt:
        name:
          [
            apt-transport-https,
            ca-certificates,
            curl,
            gnupg,
            software-properties-common,
          ]
        state: present
        update_cache: yes
        cache_valid_time: 3600
      become: true
      register: apt_result
      until: apt_result is success
      retries: 5
      delay: 10
      environment:
        DEBIAN_FRONTEND: noninteractive
    
    - name: Assign deployment user to the docker group
      user:
        name: "{{ ansible_user }}"
        groups: docker
        append: yes
