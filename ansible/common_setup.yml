---
- name: "🌐 Baseline OS Hardening"
  hosts: all
  gather_facts: false # 🟢 CHANGED: Stop Ansible from gathering facts before checking SSH connection
  become: true

  tasks:
    # 🟢 NEW: Ensure the VMs are fully awake and accepting SSH before doing anything else
    - name: Wait for VMs to become fully reachable via SSH
      ansible.builtin.wait_for_connection:
        timeout: 90
        delay: 5

    # 🟢 NEW: Safely gather facts now that we know the connection is stable
    - name: Gather facts after connection confirmation
      ansible.builtin.setup:

    - name: Ensure clean baseline state
      become: true
      block:
        - name: Wait for Cloud-Init first-boot processes to finish on hypervisor
          ansible.builtin.command: cloud-init status --wait
          changed_when: false
          failed_when: false

        - name: Force functional upstream DNS nameservers
          ansible.builtin.copy:
            dest: /etc/resolv.conf
            content: |
              nameserver 8.8.8.8
              nameserver 1.1.1.1

        - name: Remove broken legacy Docker repositories
          ansible.builtin.file:
            path: "{{ item }}"
            state: absent
          loop:
            - /etc/apt/sources.list.d/docker.list
            - /etc/apt/sources.list.d/download_docker_com_linux_ubuntu.list

        - name: Force break stuck apt/dpkg locks and clear dead metadata
          ansible.builtin.shell: |
            killall apt apt-get dpkg unattended-upgrades 2>/dev/null || true
            rm -f /var/lib/dpkg/lock-frontend /var/lib/dpkg/lock
            rm -f /var/lib/apt/lists/lock /var/cache/apt/archives/lock
            dpkg --configure -a
            apt-get clean
          failed_when: false

        - name: Force short connection timeouts for APT configuration
          ansible.builtin.copy:
            dest: /etc/apt/apt.conf.d/99timeout
            content: |
              Acquire::http::Timeout "10";
              Acquire::https::Timeout "10";
              Acquire::ftp::Timeout "10";
              Acquire::Retries "2";

        - name: Update package cache with fixed DNS
          ansible.builtin.apt:
            update_cache: yes
          environment:
            DEBIAN_FRONTEND: noninteractive

    - name: Install baseline system prerequisites
      apt:
        name:
          [
            apt-transport-https,
            ca-certificates,
            curl,
            gnupg,
            software-properties-common,
          ]
        state: present
        update_cache: yes
        dpkg_options: 'force-confold,force-confdef'
      become: true
      register: apt_result
      until: apt_result is success
      retries: 5
      delay: 10
      environment:
        DEBIAN_FRONTEND: noninteractive
        DEBCONF_NONINTERACTIVE_SEEN: "true"
        NEEDRESTART_MODE: "a"
    
    - name: Assign deployment user to the docker group
      user:
        name: "{{ ansible_user }}"
        groups: docker
        append: yes
