services:
  gatekeeper:
    image: nginx:alpine   # <-- Matches the tag built by your workflow step
    container_name: gatekeeper
    ports:
      - "80:80"
    volumes:
      #  Mounts into conf.d so Nginx automatically wraps it inside 'http'
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro

      #  Master dynamic switch string file (Read/Write for the script)
      - ./live_environment.conf:/etc/nginx/live_environment.conf
      
    restart: unless-stopped
