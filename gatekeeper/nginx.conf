map $target_environment $downstream_backend {
    default        "10.10.10.100.80";
    "Set_100"      "10.10.10.100:80";
    "set_200"        "10.10.10.200:80";
    "set_210"        "10.10.10.210:80";
}

server {
    listen 80;
    server_name _;

    location / {
        # 2. Force Nginx to look up IPs dynamically every second 
        resolver 127.0.0.1 valid=1s;

        # 3. Pull in the active environmental state string (set_A, set_B, etc.)
        include live_environment.conf;

        # 4. Route traffic over the vmbr1 bridge using the dynamic map variable
        proxy_pass http://$downstream_backend;
        
        # Standard headers to preserve client details
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Performance and connection stability timeouts
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;

        # WebSockets capability (Essential if any backend uses modern panels, consoles, or notifications)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
